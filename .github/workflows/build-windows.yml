name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -v
      - name: Build EXE
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name IFC_Steel_List_Generator `
            --collect-all ifcopenshell `
            --collect-all PySide6 `
            --paths src `
            run_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: IFC_Steel_List_Generator-Windows
          path: dist/IFC_Steel_List_Generator.exe
      - name: Attach EXE to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/IFC_Steel_List_Generator.exe
