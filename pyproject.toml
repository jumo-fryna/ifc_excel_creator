[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ifc-steel-list-generator"
version = "1.0.0"
description = "Lokalny generator zestawień stali z modeli IFC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ifcopenshell>=0.8.0",
  "openpyxl>=3.1.5",
  "PySide6>=6.8",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-cov>=5.0"]
build = ["pyinstaller>=6.11"]

[project.scripts]
ifc-steel-list-generator = "ifc_steel_generator.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

